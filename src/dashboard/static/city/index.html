<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Ciudad energética 3D</title>
  <style>
    /* The indicators and the interaction hint live in the dashboard (views/overview.py);
       this page only draws the scene and its section hotspots, in the "Vision" glass style. */
    :root {
      --bg: #0b1016; --glass: rgba(30, 36, 44, .55); --edge: rgba(255, 255, 255, .18);
      --ink: #ffffff; --ink-2: rgba(255, 255, 255, .74); --ink-3: rgba(255, 255, 255, .58);
      --accent: #64d2ff; --danger: #ff6961;
      --ease: cubic-bezier(.2, .8, .2, 1); --blur: blur(24px) saturate(170%);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text",
        "Segoe UI", Inter, Roboto, sans-serif;
      color: var(--ink); -webkit-font-smoothing: antialiased;
      background: radial-gradient(ellipse at 50% 62%, #15202b 0%, var(--bg) 64%, #070a0e 100%);
    }
    #city { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #hotspots { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
    .hotspot {
      position: absolute; left: 0; top: 0; padding: 0; border: 0; background: none;
      pointer-events: auto; cursor: pointer; font: inherit; color: inherit;
    }
    .hs-body {
      position: absolute; left: 0; bottom: calc(12px + var(--lift, 0px)); transform: translateX(-50%);
      display: flex; align-items: center; gap: 9px; white-space: nowrap;
      padding: 6px 14px 6px 6px; border-radius: 999px; background: var(--glass);
      box-shadow: 0 0 0 1px var(--edge) inset, 0 12px 30px rgba(0, 0, 0, .35);
      backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
      transition: transform 180ms var(--ease), background 180ms var(--ease);
    }
    .hs-dot {
      display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%;
      background: color-mix(in srgb, var(--c) 22%, transparent);
    }
    .hs-dot::before {
      content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 28%, transparent);
    }
    .hs-text { display: grid; gap: 1px; text-align: left; }
    .hs-text strong { font-size: 12.5px; font-weight: 650; color: var(--ink); }
    .hs-text small { font-size: 11px; color: var(--ink-2); }
    .hotspot:hover .hs-body, .hotspot.active .hs-body, .hotspot:focus-visible .hs-body {
      transform: translateX(-50%) translateY(-2px); background: rgba(44, 52, 62, .72);
    }
    .hotspot:focus-visible { outline: none; }
    .hotspot:focus-visible .hs-body { box-shadow: 0 0 0 2px var(--accent), 0 12px 30px rgba(0, 0, 0, .35); }
    #loading {
      position: absolute; z-index: 1; inset: 50% 16px auto; display: grid; justify-items: center; gap: 12px;
      color: var(--ink-3); font-size: 11px; font-weight: 600; letter-spacing: .12em; pointer-events: none;
    }
    #loading::before {
      content: ""; width: 26px; height: 26px; border-radius: 50%;
      border: 2px solid rgba(100, 210, 255, .18); border-top-color: var(--accent);
      animation: spin 900ms linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #error {
      display: none; position: absolute; z-index: 3; inset: 44% 16px auto; text-align: center;
      color: var(--ink); font-size: 13px; padding: 16px; border-radius: 18px;
      background: rgba(30, 36, 44, .92); box-shadow: 0 0 0 1px color-mix(in srgb, var(--danger) 40%, transparent) inset;
    }
    @media (max-width: 680px) {
      .hs-text small { display: none; }
      .hs-body { padding: 4px 11px 4px 4px; gap: 7px; }
      .hs-dot { width: 20px; height: 20px; }
        }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation-duration: 1ms !important; }
    }
  </style>
</head>
<body>
  <canvas id="city" aria-label="Ciudad 3D representativa de la demanda eléctrica agregada peninsular"></canvas>
  <div id="hotspots" aria-label="Accesos a las secciones del dashboard"></div>
  <div id="loading">CARGANDO CIUDAD 3D…</div>
  <div id="error">La escena 3D no está disponible en este navegador. Los indicadores siguen mostrando los datos de la API.</div>
  <script src="./config.js?v=1"></script>
  <script type="module" src="./city.js?v=23"></script>
</body>
</html>

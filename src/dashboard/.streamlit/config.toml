# Native widget palettes (canvas tables, focus, checkboxes). Custom System/Claro/Oscuro
# appearance uses the tokens in components/layout.py and styles/dashboard.css.
[theme.light]
primaryColor = "#0a9db0"
backgroundColor = "#eef2f6"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f1722"

[theme.dark]
primaryColor = "#35d0e0"
backgroundColor = "#070b11"
secondaryBackgroundColor = "#111922"
textColor = "#e9eef5"

[server]
enableStaticServing = true

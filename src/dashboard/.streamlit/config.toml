# Scoped native palettes; custom System/Claro/Oscuro uses the same tokens.
[theme.light]
primaryColor = "#078c63"
backgroundColor = "#f6f9f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#17251f"

[theme.dark]
primaryColor = "#21d18b"
backgroundColor = "#07130f"
secondaryBackgroundColor = "#0d1d17"
textColor = "#e7f5ed"

[server]
enableStaticServing = true
